version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trek_postgres_temp
    environment:
      POSTGRES_DB: trek_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_temp:/var/lib/postgresql/data

volumes:
  postgres_data_temp: